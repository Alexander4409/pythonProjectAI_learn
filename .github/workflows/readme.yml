name: Sync README

on:
  push:
    paths:
      - '**/*.py'
      - '.github/sync_readmes.py'
      - '.github/assets/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/sync_readmes.py
      - name: Commit README changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- README.md '**/README.md'
          git diff --cached --quiet || git commit -m "README"
          git push
